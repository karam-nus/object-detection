title: "Object Detection — The Complete Guide"
description: "From IoU to YOLO26 and beyond: how machines find, box and name things — tiny MCU detectors to billion-parameter grounding models, with every YOLO axis taken apart."
baseurl: "/object-detection"
url: "https://karam-nus.github.io"

markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: "highlight"
    span:
      line_numbers: false
    block:
      line_numbers: true

plugins:
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: false

include:
  - README.md

exclude:
  - code/
  - tools/
  - Gemfile
  - Gemfile.lock

